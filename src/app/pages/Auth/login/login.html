<div class="login-wrapper">

  <!-- Left: hero image panel -->
  <div class="login-hero">
    <img class="login-hero__img" src="img/logo.jpeg" alt="Clinic">
    <div class="login-hero__overlay">
      <div class="login-hero__text">
        <p class="login-hero__title">Welcome to Alamany Dental Clinic</p>
        <small class="login-hero__sub">
          Your trusted partner for comprehensive dental care.
          Experience professional treatment in a comfortable environment.
        </small>
      </div>
    </div>
  </div>

  <!-- Right: form panel -->
  <div class="login-form-panel">
    <div class="login-form-inner">

      <p class="small-title mb-1">Sign in to your account</p>
      <small class="text-muted d-block mb-4">Access your dental health portal</small>

      <form [formGroup]="loginForm" (ngSubmit)="login(loginForm)">

        <div class="login-field">
          <label class="login-label">
            Email Address <span class="required">*</span>
          </label>
          <input
            class="form-control login-input"
            formControlName="email"
            placeholder="your.email@example.com"
            type="email">
        </div>

        <div class="login-field">
          <label class="login-label">
            Password <span class="required">*</span>
          </label>
          <div class="password-wrap">
            <input
              class="form-control login-input"
              formControlName="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Enter Your Password"/>
            <span class="eye-icon" (click)="togglePassword()">
              <i class="fa-regular fa-sm"
                 [ngClass]="!showPassword ? 'fa-eye' : 'fa-eye-slash'"></i>
            </span>
          </div>
        </div>

        <div class="login-meta">
          <div class="remember-me">
            <input type="checkbox" class="form-check-input m-0" id="remember">
            <label class="form-label m-0" for="remember">Remember me</label>
          </div>
          <a class="forgot-link">Forgot Password?</a>
        </div>

        <button
          type="submit"
          [disabled]="loginForm.invalid"
          class="btn submit-btn w-100 text-white rounded-3 py-2 mt-4">
          Sign In
        </button>

      </form>
    </div>
  </div>

</div>
