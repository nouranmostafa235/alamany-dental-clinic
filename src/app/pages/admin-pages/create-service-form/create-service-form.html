<div class="blog-form-wrap">
  <div class="blog-form-header">
    <h2 class="blog-form-title">Create Service</h2>
    <p class="blog-form-subtitle">Fill in the details below to publish a new service</p>
  </div>

    <form [formGroup]="createForm" (ngSubmit)="createService(createForm)">

      <div class="blog-form-grid">
        <div class="form-panel">
          <div class="form-group">
            <label class="form-label">Name <span class="form-required">*</span></label>
            <input formControlName="name" placeholder="service Name" class="form-input" type="text">
          </div>
          <div class="form-group">
            <label class="form-label">Category <span class="form-required">*</span></label>
            <div class="select-wrap">
              <select formControlName="category" class="form-input form-select">
                <option value="">Select a category…</option>
                @for (category of serviceList; track $index) {
                  <option [value]="category">{{ category }}</option>
                }
              </select>
              <svg class="select-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Description <span class="form-required">*</span></label>
            <textarea formControlName="description" class="form-input form-textarea" placeholder="Write your full description…" rows="6"></textarea>
          </div>
        </div>
        <div class="form-panel">
          <div class="form-group">
            <label class="form-label">
              Cover Image <span class="form-required">*</span>
            </label>

            <div class="upload-zone" (click)="coverInput.click()">
              <input
                #coverInput
                type="file"
                accept="image/*"
                (change)="onImageChange($event)"
                style="display:none"
              >

              <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
                   stroke="#a0aab6" stroke-width="1.5"
                   stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>

              <p class="upload-zone__label">
                Upload cover image or <span>browse</span>
              </p>
            </div>

            @if (coverPreview) {
              <div class="media-previews">
                <div class="media-thumb">
                  <img [src]="coverPreview" class="media-thumb__img">

                  <button
                    type="button"
                    class="media-thumb__remove"
                    (click)="removeCover()">

                    <svg width="10" height="10" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor"
                         stroke-width="3" stroke-linecap="round"
                         stroke-linejoin="round">
                      <line x1="18" y1="6" x2="6" y2="18"/>
                      <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                  </button>
                </div>
              </div>
            }
          </div>

            <div formGroupName="price">
              <div class="form-group mb-3">
                <label class="form-label">Min Price <span class="form-required">*</span></label>
                <input formControlName="min" placeholder="Min Price" class="form-input" type="number" min="0">
              </div>
              <div class="form-group">
                <label class="form-label">Max Price <span class="form-required">*</span></label>
                <input formControlName="max" placeholder="Max Price" class="form-input" type="number" min="0">
              </div>
            </div>

        </div>
      </div>
      <div class="form-footer">
        <button [disabled]="createForm.invalid" type="submit" class="submit-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          {{isEditMode?'Edit':'Create'}}
        </button>
      </div>

    </form>
  </div>
