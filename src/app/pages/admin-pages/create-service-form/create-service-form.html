<div style="background-color: #FAFAFA" class="wizard-container">
  <div class="wizard-header">
    <h2>Add Service</h2>
  </div>
  <div class="form-card">
    <form [formGroup]="createForm" (ngSubmit)="createService(createForm)">
      <div class="d-flex align-items-stretch gap-2">
        <div class="col-md-6 bg-white p-2 rounded-2">
          <input formControlName="name" placeholder="service Name" class="form-control mb-3" type="text">
          <select formControlName="category" class="form-select">
            <option value="">Service Category</option>
            @for (cat of serviceList; track $index) {
              <option [value]="cat">{{cat}}</option>
            }
          </select>

          <textarea placeholder="Description" formControlName="description" class="form-control mb-3" rows="5"></textarea>

        </div>
        <div class="col-md-6 d-flex flex-column">
          <div class="p-3 rounded-2 bg-white">
            <input class="form-control" (change)="onImageChange($event)" type="file" accept="image">
          </div>
          <div class="p-2 rounded-2 bg-white">
            <div formGroupName="price">
              <input formControlName="min" placeholder="Min Price" class="form-control mb-3" type="number" min="0">
              <input formControlName="max" placeholder="Max Price" class="form-control mb-3" type="number" min="0">
            </div>

          </div>
        </div>
      </div>
      <button type="submit" class="btn d-block mx-auto mt-3 px-5">{{isEditMode?'Edit':'Create'}}</button>
    </form>
  </div>

<!--  <mat-dialog-actions align="end">-->
<!--    <button mat-button mat-dialog-close>Close</button>-->
<!--  </mat-dialog-actions>-->
</div>
