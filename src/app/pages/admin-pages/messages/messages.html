<div class="container-fluid ">
  <h2 class="title">Messages</h2>
  <p class="description">View and manage patient Messages.</p>
  <div class="container  card">
    <div class="mt-5 container">
      @for (message of allMessages; track message._id) {
        <div class="d-flex justify-content-between message-card small-shadow p-3 mb-4 rounded-3">
          <div class="d-flex gap-3">
            <div class="text-center p-2 date-card text-white rounded-3">
              <p class="m-0">Date</p>
              <p class="m-0 fw-bold">Dec</p>
              <p class="m-0 fw-bold">24,2025</p>
            </div>
            <div>
              <p class="m-0 title">{{message.name}}</p>
              <div class="d-flex gap-3">
                <p class="m-0 description">
                  <i class="fa-solid fa-xs fa-envelope me-1" style="color:var(--gray-color);"></i>
                  {{ message.email }}
                </p>
                <p class="m-0 description">
                  <i class="fa-solid fa-xs fa-phone me-1" style="color:var(--gray-color)"></i>
                  {{ message.phone }}
                </p>
              </div>
              <p class="m-0 description"> <span style="color: var(--light-color)">
              {{message.message}}
      </span>
              </p>

            </div>

          </div>
          <div>
          </div>
        </div>
      }
    </div>
  </div>

</div>
