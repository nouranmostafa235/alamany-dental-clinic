<nav class="sidebar" [class.sidebar--collapsed]="isCollapsed">

  <!-- Header -->
  <div class="sidebar__header">
    <a routerLink="/home" class="sidebar__brand" [class.sidebar__brand--hidden]="isCollapsed">
      <img class="sidebar__logo" src="img/logo.jpeg" alt="Alamany Clinic">
      <span class="sidebar__brand-name">Alamany Clinic</span>
    </a>
    <button class="sidebar__toggle" (click)="toggleSidebar()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="sidebar__divider"></div>

  <!-- Nav Links -->
  <ul class="sidebar__nav">

    <li class="sidebar__item">
      <a class="sidebar__link" routerLink="/admin" routerLinkActive="sidebar__link--active" [routerLinkActiveOptions]="{ exact: true }">
        <span class="sidebar__icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </span>
        <span class="sidebar__label">Dashboard</span>
      </a>
    </li>

    <li class="sidebar__item">
      <a class="sidebar__link" routerLink="doctors" routerLinkActive="sidebar__link--active">
        <span class="sidebar__icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
        </span>
        <span class="sidebar__label">Doctors</span>
      </a>
    </li>

    <li class="sidebar__item">
      <a class="sidebar__link" routerLink="appointments" routerLinkActive="sidebar__link--active">
        <span class="sidebar__icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </span>
        <span class="sidebar__label">Appointments</span>
      </a>
    </li>

    <li class="sidebar__item">
      <a class="sidebar__link" routerLink="blog-posts" routerLinkActive="sidebar__link--active">
        <span class="sidebar__icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </span>
        <span class="sidebar__label">Blog Posts</span>
      </a>
    </li>

    <li class="sidebar__item">
      <a class="sidebar__link" routerLink="services-management" routerLinkActive="sidebar__link--active">
        <span class="sidebar__icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </span>
        <span class="sidebar__label">Services</span>
      </a>
    </li>

    <li class="sidebar__item">
      <a class="sidebar__link" routerLink="messages-management" routerLinkActive="sidebar__link--active">
        <span class="sidebar__icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </span>
        <span class="sidebar__label">Messages</span>
      </a>
    </li>

  </ul>

  <!-- Spacer -->
  <div class="sidebar__spacer"></div>

  <div class="sidebar__divider"></div>

  <!-- Logout -->
  <div class="sidebar__footer">
    <button class="sidebar__logout" (click)="logout()">
      <span class="sidebar__icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </span>
      <span class="sidebar__label">Log Out</span>
    </button>
  </div>

</nav>
