<div class="wrapper">
  <div class="hero-header">
<!--    <div class="hero-badge">-->
<!--      <i class="fa fa-calendar-check"></i>-->
<!--      Book Appointment-->
<!--    </div>-->
    <h2 class="hero-title">Find Your Doctor</h2>
    <p class="hero-sub">Select a specialist to begin your consultation journey</p>
  </div>

  <div class="doctors-list">
    @for (doctor of allDoctors; track doctor._id; let i = $index) {
      <div
        class="doctor-card"
        [style.animation-delay]="i * 60 + 'ms'"
        (click)="nextStep(doctor.firstName+' '+doctor.lastName, doctor.picture, doctor._id,doctor.overallRating.averageRating)">

        <!-- Left accent bar -->
        <div class="card-accent"></div>

        <!-- Avatar -->
        <div class="card-avatar-wrap">
          <img class="card-avatar" [src]="doctor.picture" [alt]="doctor.firstName">
          <div class="avatar-ring"></div>
        </div>

        <!-- Info -->
        <div class="card-info">
          <div class="card-name">Dr. {{ doctor.firstName }} {{ doctor.lastName }}</div>
          <div class="card-spec">{{ doctor.specialization?.join(' · ') || 'General Practitioner' }}</div>
<!--          <div class="card-meta">-->
<!--            <span class="meta-tag">-->
<!--              <i class="fa fa-map-marker-alt"></i> Cairo-->
<!--            </span>-->
<!--            <span class="meta-tag">-->
<!--              <i class="fa fa-clock"></i> Available today-->
<!--            </span>-->
<!--          </div>-->
        </div>

        <!-- Right side -->
        <div class="card-right">
          <div class="rating-badge">
            <i class="fa fa-star"></i>
            <span>{{ doctor.overallRating.averageRating }}</span>
          </div>
          <button
            type="button"
            class="profile-btn"
            (click)="$event.stopPropagation()"
            [routerLink]="['/doctor-profile', doctor._id]">
            View Profile
          </button>
<!--          <div class="select-hint">-->
<!--            <i class="fa fa-arrow-right"></i>-->
<!--          </div>-->
        </div>

      </div>
    }
  </div>

</div>
