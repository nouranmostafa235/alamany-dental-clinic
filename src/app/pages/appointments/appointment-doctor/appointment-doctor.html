<div class="wrapper py-4">
  <div class="content text-center">
    <h4 class="fw-bold">We're looking forward to meeting you!</h4>
    <p>Please choose doctor.</p>
  </div>

<div class="container">
  @for (doctor of allDoctors; track doctor._id) {
    <div (click)="nextStep(doctor.firstName+' '+doctor.lastName,doctor.picture, doctor._id)" class="row mb-2 message-card
  position-relative p-2 rounded-3 align-items-center m-0">
      <div class="p-0 col-md-2">
        <img class="dr-img rounded-3" [src]="doctor.picture">
      </div>
      <div class="col-md-9 px-5 d-flex flex-column gap-1">
        <h4 class="text-start">Dr.{{doctor.firstName+' '+doctor.lastName  }}</h4>
        <p class="text-start">{{ doctor.specialization?.join(', ') }}</p>
        <button (click)="$event.stopPropagation()" [routerLink]="['/doctor-profile', doctor._id]" class="btn">View Profile</button>
      </div>
      <div class="icon position-absolute d-flex gap-1 justify-content-center align-items-center bg-white rounded-pill">
        <i class="fa fa-star" style="color: gold"></i>
        4.5
      </div>

    </div>
  }


</div>
