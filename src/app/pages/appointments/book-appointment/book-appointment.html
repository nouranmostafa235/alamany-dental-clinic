<div class="wrapper position-relative">

  <button class="back-btn" (click)="goBack()">
    <span class="back-btn__track">
      <span class="back-btn__arrow">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </span>
    </span>
    <span class="back-btn__glow"></span>
  </button>

  <!-- LEFT: fixed on desktop, stacked on tablet/mobile -->
  <div class="logo d-flex flex-column align-items-center justify-content-center">
    <img src="img/logo-semi.png" routerLink="/" alt="Logo">
  </div>

  <!-- RIGHT: scrollable panel -->
  <div class="side-div d-flex justify-content-center align-items-start">
    <div class="w-100 h-100 p-4 text-center">
      <router-outlet></router-outlet>
    </div>
  </div>

</div>
