<section class="doctor-profile">
  <div class="profile-container">
    @if (doctorData) {
      <div class="profile-image">
        <img [src]="doctorData.picture" alt="Dr. Sarah Mitchell">
      </div>
      <div class="profile-content">
        <h2>Dr. {{ doctorData.firstName}} {{doctorData.lastName}}</h2>

        <h4>{{ doctorData.specialization?.join(', ') }}</h4>

        <p>
          {{
            doctorData.bio
          }}
        </p>

        <div class="profile-actions">
          <button routerLink="/book-appointment" class="btn primary">
            Book Appointment
          </button>

          <button class="btn outline">
            Review
          </button>
        </div>
      </div>
    }

  </div>
</section>
