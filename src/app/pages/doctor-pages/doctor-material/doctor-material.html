<div class="material-section">

  <div class="section-header">
    <span class="section-badge">Resources</span>
    <h6 class="section-title">Material Used</h6>
    <p class="section-subtitle">Materials shared by the doctor for patient reference</p>
  </div>

  @if (doctorData$ | async; as doctorData) {
    <div class="carousel-wrapper">
      <owl-carousel-o [options]="customOptions">
        @for (material of doctorData.materials; track material.id) {
          <ng-template carouselSlide>
            <div class="material-card" (click)="openImage(material.fileUrl)">
              <div class="material-card__img-wrap">
                <img [src]="material.fileUrl" class="material-card__img" alt="Material">
                <div class="material-card__overlay">
                  <span class="material-card__view-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                      <circle cx="12" cy="12" r="3"/>
                    </svg>
                    View
                  </span>
                </div>
              </div>
            </div>
          </ng-template>
        }
      </owl-carousel-o>
    </div>
  } @else {
    <div class="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#c5cdd8" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      <p>No materials available</p>
    </div>
  }

  <!-- Lightbox -->
  @if (activeImage) {
    <div class="lightbox" (click)="closeImage()">
      <div class="lightbox__content" (click)="$event.stopPropagation()">
        <button class="lightbox__close" (click)="closeImage()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
        <img [src]="activeImage" alt="Material" class="lightbox__img">
        <div class="lightbox__footer">
          <span class="lightbox__label">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            Educational Material
          </span>
        </div>
      </div>
    </div>
  }

</div>
