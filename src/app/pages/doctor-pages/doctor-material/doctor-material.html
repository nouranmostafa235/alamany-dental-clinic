<div class="container mt-5 mb-5">
  <div class="mt-5">
    @if (doctorData$ | async; as doctorData) {
      <owl-carousel-o [options]="customOptions">
        @for (material of doctorData.materials; track material.id) {
          <ng-template carouselSlide>
            <div class="card mb-2 mx-auto">
              <img [src]="material.fileUrl" class="card-img-top" alt="...">
            </div>
          </ng-template>
        }

      </owl-carousel-o>
    }



  </div>
</div>
