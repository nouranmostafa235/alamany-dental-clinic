
  <div class="container mt-5 mb-5">
    @if (doctorData$ | async; as doctorData) {
      @for (doctor of doctorData.officeHours; track $index) {
        <div class="d-flex mt-4 justify-content-between office-hours rounded-4  p-4">
          <div class="d-flex gap-2 align-items-center">
            <div class="calendar">
              <i class="fa-regular fa-calendar" style="color: white"></i>
            </div>
            <p class="m-0 days">{{ doctor.day }}</p>
          </div>
          <div class="d-flex gap-2 align-items-center">
            <div class="clock">
              <i class="fa-regular fa-clock" style="color: white"></i>
            </div>
            <p class="m-0 days">{{ doctor.open }} - {{ doctor.close }}</p>
          </div>
        </div>

      }
    }


  </div>
