<div class="profile">

  <div class="d-flex align-items-center gap-3 rounded-4 fixed-top p-4 return mx-auto">
    <button class="back-btn" (click)="goBack()">
  <span class="back-btn__track">
    <span class="back-btn__arrow">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </span>
  </span>
      <span class="back-btn__glow"></span>
    </button>
    <div><h4 class="m-0">Doctor Profile</h4></div>
  </div>
  <div class="wrapper">
    <app-doctor-info-section></app-doctor-info-section>
    <div class="mt-5 gray-bg pt-5">
      <ul class="navbar-nav d-flex flex-row flex-wrap mx-auto w-75 justify-content-center gap-4 mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link"
             aria-current="page"
             [routerLink]="['/doctor-profile', doctorId]"
             [routerLinkActiveOptions]="{exact:true}"
             routerLinkActive="active"
             >Certificates</a>
        </li>
        <li class="nav-item">
          <a class="nav-link"
             routerLinkActive="active"
             routerLink="material"
             >Material</a>
        </li>
        <li class="nav-item">
          <a class="nav-link"
             routerLinkActive="active"
             routerLink="office-hours"
             >Availability</a>
        </li>
      </ul>
      <div class="tabs-line"></div>
      <div class=" container rounded-3 mt-4 mb-4">
        <router-outlet></router-outlet>
      </div>
      <div class=" bg-white">
        <app-doctor-review></app-doctor-review>
      </div>

    </div>
    <app-footer></app-footer>
  </div>
</div>
