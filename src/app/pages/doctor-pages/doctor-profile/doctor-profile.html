<!--<app-nav-bar></app-nav-bar>-->
<div class="profile">

  <div class="topbar d-flex align-items-center gap-3 fixed-top px-5 py-3 mx-auto">
    <button class="back-btn" (click)="goBack()">
      <span class="back-btn__track">
        <span class="back-btn__arrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 5l-7 7 7 7"/>
          </svg>
        </span>
      </span>
      <span class="back-btn__glow"></span>
    </button>
    <div class="topbar__divider"></div>
    <h5 class="topbar__title m-0">Doctor Profile</h5>
  </div>

  <div class="wrapper">
    <div class="hero-section">
      <app-doctor-info-section></app-doctor-info-section>
    </div>

    <div class="content-area">

      <div class="tabs-wrapper">
        <ul class="tabs-nav">
          <li class="tab-item">
            <a class="tab-link"
               aria-current="page"
               [routerLink]="['/doctor-profile', doctorId]"
               [routerLinkActiveOptions]="{exact:true}"
               routerLinkActive="active">
<!--              <span class="tab-icon">🎓</span>-->
              Certificates
            </a>
          </li>
          <li class="tab-item">
            <a class="tab-link"
               routerLinkActive="active"
               routerLink="material">
<!--              <span class="tab-icon">📋</span>-->
              Material
            </a>
          </li>
          <li class="tab-item">
            <a class="tab-link"
               routerLinkActive="active"
               routerLink="office-hours">
<!--              <span class="tab-icon">🕐</span>-->
              Availability
            </a>
          </li>
          <li class="tab-item">
            <a class="tab-link"
               routerLinkActive="active"
               routerLink="previous-cases">
<!--              <span class="tab-icon">🩺</span>-->
              Previous Cases
            </a>
          </li>
        </ul>
        <div class="tabs-underline"></div>
      </div>

      <div class="tab-content-area">
        <router-outlet></router-outlet>
      </div>

      <div class="reviews-section">
        <app-doctor-review></app-doctor-review>
      </div>

    </div>

    <app-footer></app-footer>
  </div>
</div>
