  <div class="mt-5 container p-4" >
    <div>
      <div class="d-flex align-items-center gap-3">
        <h4 style="color: var(--dark-color)" class="m-0">Reviews & Ratings</h4>
        <div class="rating">
          {{ totalNoOfRatings }}
        </div>
      </div>
      <div class="d-flex mt-4 gap-3">
        <div >
          <h1 class="rate-no">{{ overAllRate }}</h1>
        </div>
        <div>
          <div>
            @for (star of getRate(overAllRate); track $index) {
              <i
                class="fa {{ star }}"
                style="color: gold">
              </i>
            }

          </div>
          <div>
            <p class="m-0" style="color: var(--gray-color)">Overall ratings</p>
          </div>
        </div>
      </div>
    </div>
    <div class="mt-4">
      @if (allReviews.length>0) {
        <owl-carousel-o [options]="customOptions">
          @for (review of allReviews; track $index) {
            <ng-template carouselSlide>
              <div class="card mx-auto p-4" >
                <div class="d-flex gap-2 align-items-center">
                  <div class="icon">
                    <i style="color: var(--dark-bg-color)" class="fa-regular fa-l fa-user"></i>
                  </div>
                  <div>
                    <p class="m-0" style="color:var(--dark-bg-color);">Linda Lwies</p>
                    <div class="stars">
                      @for (star of getStars(review.rating); track star) {
                        <span [class.filled]="star <= review.rating"><i class="fa fa-2xs fa-star"></i></span>
                      }
                    </div>
                  </div>
                </div>
                <div class="mt-3" style="color: var(--dark-color)">
                  “{{review.comment}}”
                </div>
              </div>
            </ng-template>
          }


        </owl-carousel-o>
      }

    </div>
  </div>
