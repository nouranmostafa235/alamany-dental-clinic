<app-nav-bar></app-nav-bar>

<div class="blog-page">

  <!-- Hero -->
  <section class="blog-hero" [style.background-image]="latestBlogSrc">
    <div class="blog-hero__overlay">
      <div class="blog-hero__content container">
        <span class="blog-hero__eyebrow">Our Blog</span>
        <h1 class="blog-hero__title">Insights for a<br><em>Healthier Smile</em></h1>
        <p class="blog-hero__desc">
          Bringing you the latest &amp; greatest in oral care health.
        </p>
        <div class="blog-hero__scroll-hint">
          <span>Scroll to explore</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12l7 7 7-7"/>
          </svg>
        </div>
      </div>
    </div>
  </section>

  <!-- Filter Tags -->
  <div class="blog-filters">
    <div class="container">
      <div class="blog-filters__inner">
        <a class="filter-tag" [class.filter-tag--active]="activeTag === 'all'"
           (click)="setActive('all')">
          All Posts
        </a>
        @for (tag of tags; track $index) {
          <a class="filter-tag" [class.filter-tag--active]="activeTag === tag"
             (click)="setActive(tag)">
            {{ tag }}
          </a>
        }
      </div>
    </div>
  </div>

  <!-- Blog Posts -->
  <div class="blog-content container">
    <app-blog-post [filteredBlogs]="filteredBlogs"></app-blog-post>
  </div>

</div>

<app-footer></app-footer>
