<div class="contact-section">
  <div class="container">

    <div class="section-header">
      <span class="section-badge">Get In Touch</span>
      <h2 class="section-title">Contact <em>Us</em></h2>
      <p class="section-subtitle">We'd love to hear from you — reach out anytime</p>
    </div>

    <div class="contact-grid">

      <!-- Contact Form -->
      <div class="contact-form-wrap">
        <form [formGroup]="messageForm" (ngSubmit)="createMessage(messageForm)">

          <div class="form-group">
            <label class="form-label">
              Name
              <span class="form-required">*</span>
            </label>
            <div class="input-wrap">
              <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
              <input formControlName="name" type="text" placeholder="Your Name" class="form-input">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">
              Email
              <span class="form-required">*</span>
            </label>
            <div class="input-wrap">
              <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
              </svg>
              <input formControlName="email" type="email" placeholder="your.email@example.com" class="form-input">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">
              Phone
              <span class="form-required">*</span>
            </label>
            <div class="input-wrap">
              <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.0 1.18 2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
              </svg>
              <input formControlName="phone" type="tel" placeholder="+20 XXX XXX XXX" class="form-input">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">
              Message
              <span class="form-required">*</span>
            </label>
            <textarea formControlName="message" placeholder="Tell us how we can help you..." class="form-input form-textarea"></textarea>
          </div>

          <button [disabled]="messageForm.invalid" type="submit" class="form-submit">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
            Send Message
          </button>

        </form>
      </div>

      <!-- Info Cards -->
      <div class="contact-info">

        <a class="info-card" href="tel:+201092184470">
          <div class="info-card__icon">
            <i class="fa-solid fa-phone"></i>
          </div>
          <div class="info-card__body">
            <p class="info-card__label">Phone</p>
            <p class="info-card__value">+20 1092184470</p>
            <p class="info-card__value">034267133</p>
          </div>
          <svg class="info-card__arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </a>

        <a class="info-card" href="mailto:alamanydentalclinic@gmail.com">
          <div class="info-card__icon">
            <i class="fa-solid fa-envelope"></i>
          </div>
          <div class="info-card__body">
            <p class="info-card__label">Email</p>
            <p class="info-card__value">alamanydentalclinic@gmail.com</p>
          </div>
          <svg class="info-card__arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </a>

        <a target="_blank"
           class="info-card"
          href="https://www.google.com/maps/place/%D8%B9%D9%8A%D8%A7%D8%AF%D8%A9+%D8%A7%D9%84%D8%A3%D9%85%D8%A7%D9%86%D9%8A+%D9%84%D9%84%D8%A7%D8%B3%D9%86%D8%A7%D9%86+%D8%AF.%D8%B9%D9%85%D8%B1%D9%88+%D8%B9%D8%A8%D8%AF%D8%A7%D9%84%D9%84%D8%B7%D9%8A%D9%81%E2%80%AD/@31.2112709,29.9159991,15z">
          <div class="info-card__icon">
            <i class="fa-solid fa-location-dot"></i>
          </div>
          <div class="info-card__body">
            <p class="info-card__label">Location</p>
            <p class="info-card__value">8TH Elbayrony ST Sporting, Aboqir, Alexandria</p>
          </div>
        </a>

        <div class="info-card">
          <div class="info-card__icon info-card__icon--clock">
            <i class="fa-solid fa-clock"></i>
          </div>
          <div class="info-card__body">
            <p class="info-card__label">Working Hours</p>
            <p class="info-card__value">Sun – Fri: 8:00 AM – 6:00 PM</p>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>
