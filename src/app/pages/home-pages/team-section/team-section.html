<div class="py-5 wrapper">
  <div class="container">
    <div class="mt-4">
      <owl-carousel-o [options]="customOptions">
        @for (doctor of allDoctors; track doctor._id) {
          <ng-template carouselSlide>
            <div [routerLink]="['/doctor-profile', doctor._id]" class="card mb-2 mx-auto">
              <img [src]="doctor.picture" class="card-img-top" alt="...">
            </div>
          </ng-template>
        }
        <ng-template carouselSlide>
          <div routerLink="/doctor-profile" class="card mb-2 mx-auto">
            <img src="img/dr-omnia.jpg" class="card-img-top" alt="...">
          </div>
        </ng-template>
        <ng-template carouselSlide>
          <div routerLink="/doctor-profile" class="card mb-2 mx-auto">
            <img src="img/dr-omnia.jpg" class="card-img-top" alt="...">
          </div>
        </ng-template>
        <ng-template carouselSlide>
          <div routerLink="/doctor-profile" class="card mb-2 mx-auto">
            <img src="img/dr-omnia.jpg" class="card-img-top" alt="...">
          </div>
        </ng-template>
        <ng-template carouselSlide>
          <div routerLink="/doctor-profile" class="card mb-2 mx-auto">
            <img src="img/dr-omnia.jpg" class="card-img-top" alt="...">
          </div>
        </ng-template>
      </owl-carousel-o>
    </div>
  </div>
</div>
