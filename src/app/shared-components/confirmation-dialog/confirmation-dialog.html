<div class="dialog-container">
  <!-- Icon -->
  <div class="icon-wrapper">
    <div [ngClass]="data.status === 'confirmed'? 'confirm-circle':'icon-circle'" class="">
        @if (data.status === 'cancelled' || data.status === 'delete') {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
          </svg>
        } @else if (data.status === 'confirmed'){
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="#22c55e"
            stroke-width="2"
            width="24"
            height="24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
            />
          </svg>
        }
    </div>
  </div>

  <!-- Content -->
  <h2 mat-dialog-title>Are you sure?</h2>
  <mat-dialog-content>
    <p>{{ data.message }}</p>
    <p class="sub-text">This action cannot be undone.</p>
  </mat-dialog-content>

  <!-- Actions -->
  <mat-dialog-actions align="end">
    <button mat-stroked-button class="cancel-btn" (click)="dialogRef.close(false)">
      Cancel
    </button>

    <button mat-flat-button [ngClass]="data.status === 'confirmed'? 'confirm-btn' : 'delete-btn'" class="" (click)="dialogRef.close(true)">
      {{ data.status === 'confirmed'? 'Confirm' : 'Delete' }}
    </button>
  </mat-dialog-actions>
</div>
