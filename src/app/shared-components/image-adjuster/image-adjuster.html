<div class="image-adjuster">

  <!-- Drop Zone -->
  @if (!imageSrc()) {
    <div
      class="drop-zone"
      [class.dragging]="isDragging()"
      (drop)="onDrop($event)"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave()"
    >
      <input type="file" accept="image/*" (change)="onFileSelected($event)" #fileInput hidden />
      <button type="button" (click)="fileInput.click()">Choose Image</button>
      <p>or drag & drop here</p>
      @if (error()) {
        <p class="error">{{ error() }}</p>
      }
    </div>
  }

  <!-- Editor -->
  @if (imageSrc()) {
    <div class="editor">

      <!-- Canvas (crop preview) -->
      <div class="canvas-wrapper" #container>
        <canvas
          #canvas
          [style.cursor]="isDraggingImg ? 'grabbing' : 'grab'"
          (mousedown)="onMouseDown($event)"
          (mousemove)="onMouseMove($event)"
          (mouseup)="onMouseUp()"
          (mouseleave)="onMouseUp()"
          (wheel)="onWheel($event)"
          (touchstart)="onTouchStart($event)"
          (touchmove)="onTouchMove($event)"
          (touchend)="onTouchEnd()"
        ></canvas>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button type="button" (click)="zoomOut()">－</button>
        <input
          type="range"
          [min]="minScale"
          [max]="4"
          [step]="0.01"
          [value]="scale()"
          (input)="scale.set(+$any($event.target).value); clampOffset(); drawCanvas()"
        />
        <button type="button" (click)="zoomIn()">＋</button>
        <button type="button" (click)="resetZoom()">Reset</button>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button type="button" (click)="cancel()">Cancel</button>
        <button type="button" (click)="confirm()" [disabled]="isProcessing()">
          {{ isProcessing() ? 'Processing...' : 'Apply' }}
        </button>
      </div>

    </div>
  }

</div>
