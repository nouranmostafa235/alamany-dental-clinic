<div class="ic-wrapper">

  <!-- Drop / Pick zone -->
  @if (!imageSrc()) {
    <div
      class="ic-dropzone"
      [class.ic-dragover]="isDragOver()"
      (dragover)="onDragOver($event)"
      (dragleave)="isDragOver.set(false)"
      (drop)="onDrop($event)"
      (click)="fileInput.click()"
      role="button"
      tabindex="0"
      (keydown.enter)="fileInput.click()"
      aria-label="Upload image"
    >
      <svg class="ic-upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0
                 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
      </svg>
      <p class="ic-drop-label">Drop an image or <span>browse</span></p>
      <p class="ic-drop-hint">JPG, PNG, WEBP — max {{ maxSizeMb }} MB</p>
    </div>
  }

  <!-- Cropper canvas area -->
  @if (imageSrc()) {
    <div class="ic-editor">
      <div
        class="ic-canvas-wrap"
        [style.width.px]="frameSize"
        [style.height.px]="frameSize"
      >
        <canvas
          #canvas
          [width]="frameSize"
          [height]="frameSize"
          class="ic-canvas"
          (mousedown)="startDrag($event)"
          (mousemove)="onDrag($event)"
          (mouseup)="stopDrag()"
          (mouseleave)="stopDrag()"
          (touchstart)="startTouchDrag($event)"
          (touchmove)="onTouchDrag($event)"
          (touchend)="stopDrag()"
        ></canvas>

        <!-- Frame overlay -->
        <div
          class="ic-frame-overlay"
          [class.ic-frame--circle]="shape === 'circle'"
          [class.ic-frame--square]="shape === 'square'"
          [class.ic-frame--rect]="shape === 'rect'"
        ></div>
      </div>

      <!-- Controls -->
      <div class="ic-controls">
        <label class="ic-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            <line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
          Zoom
        </label>
        <input
          type="range" class="ic-range"
          min="0.5" max="3" step="0.01"
          [value]="scale()"
          (input)="onScaleChange($event)"
        />
        <span class="ic-range-val">{{ (scale() * 100).toFixed(0) }}%</span>
      </div>

      <div class="ic-controls">
        <label class="ic-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          Rotate
        </label>
        <input
          type="range" class="ic-range"
          min="-180" max="180" step="1"
          [value]="rotation()"
          (input)="onRotationChange($event)"
        />
        <span class="ic-range-val">{{ rotation() }}°</span>
      </div>

      <div class="ic-actions">
        <button type="button" class="ic-btn ic-btn--ghost" (click)="reset()">
          Reset
        </button>
        <button type="button" class="ic-btn ic-btn--ghost" (click)="changeImage()">
          Change
        </button>
        <button type="button" class="ic-btn ic-btn--primary" (click)="confirm()" [disabled]="isSaving()">
          @if (isSaving()) { Saving… } @else { {{ confirmLabel }} }
        </button>
      </div>
    </div>
  }

  <!-- Hidden file input -->
  <input
    #fileInput
    type="file"
    accept="image/*"
    class="ic-file-hidden"
    (change)="onFileSelected($event)"
  />

  @if (errorMsg()) {
    <p class="ic-error" role="alert">{{ errorMsg() }}</p>
  }
</div>
